<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAB MAYA TKJ - Modul 04</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-mono min-h-screen p-4">
    <!-- Header -->
    <header class="max-w-6xl mx-auto bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3 flex flex-col md:flex-row justify-between items-center shadow-lg">
        <div>
            <h1 class="text-base font-bold text-cyan-400">LAB MAYA TKJ <span class="text-xs bg-cyan-900 text-cyan-200 px-2 py-0.5 rounded ml-1">Modul 04</span></h1>
            <p class="text-xs text-slate-400">Simulasi CLI Protocol Diagnostics: Ping & Packet Traceroute</p>
        </div>
        <div class="flex gap-3 mt-1 md:mt-0 text-xs">
            <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Sistem: Siap</span></div>
            <div class="bg-slate-900 px-2.5 py-0.5 rounded border border-slate-700">IP Client: <strong class="text-cyan-300">192.168.1.10</strong></div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-3">
        <!-- Terminal Section -->
        <section class="lg:col-span-2 bg-slate-950 border border-slate-700 rounded-lg flex flex-col h-[520px] shadow-lg">
            <div class="bg-slate-900 px-3 py-2 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    <span class="text-xs text-slate-400 ml-2">bash - student@tkj-lab:~</span>
                </div>
                <button onclick="clearTerminal()" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded text-slate-300 cursor-pointer">Clear</button>
            </div>
            
            <div id="terminal-output" class="p-4 flex-1 overflow-y-auto text-xs space-y-2 text-slate-300">
                <div>Selamat datang di Simulator Networking CLI Lab Maya TKJ.<br>Klik tombol preset di bawah untuk menguji <strong>Ping</strong> dan melihat respons alat jaringan!</div>
            </div>

            <!-- Preset Targets -->
            <div class="bg-slate-900 px-3 py-2 border-t border-slate-800 flex flex-wrap items-center gap-1.5 text-xs">
                <span class="text-slate-400 font-bold">Uji Cepat:</span>
                <button onclick="runPreset('ping 192.168.1.1')" class="bg-slate-800 hover:bg-slate-700 text-amber-300 px-2 py-1 rounded border border-slate-700 cursor-pointer">Ping Switch L3</button>
                <button onclick="runPreset('ping 10.0.0.254')" class="bg-slate-800 hover:bg-slate-700 text-purple-300 px-2 py-1 rounded border border-slate-700 cursor-pointer">Ping Router</button>
                <button onclick="runPreset('ping 8.8.8.8')" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 px-2 py-1 rounded border border-slate-700 cursor-pointer">Ping Server</button>
                <button onclick="runPreset('traceroute 8.8.8.8')" class="bg-slate-800 hover:bg-slate-700 text-cyan-300 px-2 py-1 rounded border border-slate-700 cursor-pointer">Traceroute</button>
                <button onclick="runPreset('ping 192.168.99.99')" class="bg-slate-800 hover:bg-slate-700 text-rose-300 px-2 py-1
